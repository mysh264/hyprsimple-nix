name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: ${{ matrix.channel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [nixos-unstable, nixos-26.05]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the VM test's closure
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Packages, package mapping, scripts and module evaluation
        run: |
          nix build -L --override-input nixpkgs github:NixOS/nixpkgs/${{ matrix.channel }} \
            .#checks.x86_64-linux.package-mapping \
            .#checks.x86_64-linux.scripts \
            .#checks.x86_64-linux.module-eval \
            .#checks.x86_64-linux.template-eval \
            .#checks.x86_64-linux.hyprsimple \
            .#checks.x86_64-linux.hyprqt6engine \
            .#checks.x86_64-linux.muslimtify \
            .#checks.x86_64-linux.quickshell

      - name: NixOS VM test (install, Hyprland session, theme switch, update)
        run: |
          nix build -L --override-input nixpkgs github:NixOS/nixpkgs/${{ matrix.channel }} \
            .#checks.x86_64-linux.vm

      - name: Keep the VM screenshots
        if: always()
        run: |
          mkdir -p screenshots
          cp result/*.png screenshots/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.channel }}
          path: screenshots/
          if-no-files-found: ignore
