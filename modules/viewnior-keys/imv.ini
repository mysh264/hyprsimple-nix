# Viewnior's keys for imv, from hyprsimple-nix
# (programs.hyprsimple.viewniorKeys.enable). imv reads a ~/.config/imv/config
# of your own instead of this file: copy this one there to change it.
#
# The mouse is imv's own, and already works as in Viewnior: the wheel zooms
# where the pointer is, and dragging moves a zoomed-in photo.

[options]
# Only the keys below.
suppress_default_binds = true

[aliases]

[binds]
# The next and the previous photo, the first and the last.
<space> = next
<Right> = next
<Down> = next
<Next> = next
<Meta+Right> = next
<BackSpace> = prev
<Left> = prev
<Up> = prev
<Prior> = prev
<Meta+Left> = prev
<Home> = goto 1
<End> = goto -1
# Moving about in a zoomed-in photo.
<Shift+Left> = pan 50 0
<Shift+Right> = pan -50 0
<Shift+Up> = pan 0 50
<Shift+Down> = pan 0 -50
# Zoom.
<plus> = zoom 1
<Shift+plus> = zoom 1
<equal> = zoom 1
<KP_Add> = zoom 1
<Ctrl+plus> = zoom 1
<Ctrl+equal> = zoom 1
<minus> = zoom -1
<KP_Subtract> = zoom -1
<Ctrl+minus> = zoom -1
1 = zoom actual
<KP_1> = zoom actual
<Ctrl+0> = zoom actual
f = scaling full; reset
0 = scaling full; reset
<KP_0> = scaling full; reset
# Full screen, slideshow, closing. F5 starts a slideshow, and SHIFT + F5
# stops it (imv cannot use one key for both).
<F11> = fullscreen
<F5> = slideshow 5
<Shift+F5> = slideshow 0
<Escape> = quit
<Ctrl+w> = quit
q = quit
# Turn and flip.
<Ctrl+r> = rotate by 90
<Ctrl+Shift+R> = rotate by -90
h = flip horizontal
v = flip vertical
# Delete moves the photo to the trash, where you can get it back.
<Delete> = exec @gio@ trash -- "$imv_current_file"; close
