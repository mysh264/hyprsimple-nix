# Viewnior's keys and mouse for swayimg 4, from hyprsimple-nix
# (programs.hyprsimple.viewniorKeys.enable). swayimg reads a
# ~/.config/swayimg/config of your own instead of this file: copy this one
# there to change it. A key not named here keeps what swayimg gives it.

[list]
# As in Viewnior, the other photos in the same folder come along, so the keys
# below can turn to them.
all = yes

[slideshow]
# A slideshow turns to the next photo every 5 seconds, as in Viewnior.
time = 5

[keys.viewer]
# The next and the previous photo, the first and the last.
Space = next_file
Right = next_file
Down = next_file
Next = next_file
Alt+Right = next_file
BackSpace = prev_file
Left = prev_file
Up = prev_file
Prior = prev_file
Alt+Left = prev_file
Home = first_file
End = last_file
Alt+Home = first_file
Alt+End = last_file
# Moving about in a zoomed-in photo.
Shift+Left = step_left 10
Shift+Right = step_right 10
Shift+Up = step_up 10
Shift+Down = step_down 10
# Zoom.
Plus = zoom +10
Equal = zoom +10
KP_Add = zoom +10
Ctrl+Plus = zoom +10
Ctrl+Equal = zoom +10
Ctrl+KP_Add = zoom +10
Minus = zoom -10
KP_Subtract = zoom -10
Ctrl+Minus = zoom -10
Ctrl+KP_Subtract = zoom -10
1 = zoom 100
KP_1 = zoom 100
Ctrl+0 = zoom 100
2 = zoom 200
KP_2 = zoom 200
3 = zoom 300
KP_3 = zoom 300
f = zoom fit
0 = zoom fit
KP_0 = zoom fit
# Full screen, slideshow, closing.
F11 = fullscreen
F5 = mode slideshow
Escape = exit
Ctrl+w = exit
# Turn and flip.
Ctrl+r = rotate_right
Ctrl+Shift+r = rotate_left
h = flip_horizontal
v = flip_vertical
# Delete moves the photo to the trash, where you can get it back.
Delete = exec @gio@ trash -- '%'; skip_file
# The mouse: the wheel zooms where the pointer is, with Shift it turns
# photos, and so does scrolling sideways. Dragging moves a zoomed-in photo.
ScrollUp = zoom +10 mouse
ScrollDown = zoom -10 mouse
Shift+ScrollUp = prev_file
Shift+ScrollDown = next_file
ScrollLeft = prev_file
ScrollRight = next_file
MouseSide = prev_file
MouseExtra = next_file

[keys.slideshow]
F5 = mode viewer
Escape = mode viewer
